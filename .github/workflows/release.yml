name: release

on:
    push:
        tags: ['*']

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '22'

            - name: Install Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Prepare Build Environment
              run: cp .env.example .env && php artisan key:generate

            - name: Install Node Dependencies
              run: npm ci

            - name: Build Assets
              run: npm run build

            - name: Prune Dev Dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            - name: Remove Build Environment File
              run: rm -f .env

            - name: Assemble Release Zip
              run: |
                  mkdir -p dist/moneta
                  rsync -a --exclude-from=.github/release-excludes.txt ./ dist/moneta/
                  cd dist && zip -rq "moneta-${GITHUB_REF_NAME}.zip" moneta

            - name: Publish Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" --generate-notes dist/moneta-*.zip \
                      || gh release upload "$GITHUB_REF_NAME" dist/moneta-*.zip --clobber
